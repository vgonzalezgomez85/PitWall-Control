# Traducciones de la app (gen-l10n). Diccionarios en lib/l10n/app_<idioma>.arb;
# el español es la plantilla. Se regenera solo al compilar (flutter: generate).
arb-dir: lib/l10n
template-arb-file: app_es.arb
output-dir: lib/l10n/generado
output-localization-file: textos.dart
output-class: Textos
header-file: cabecera_licencia.txt
nullable-getter: true
